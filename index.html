/* PACKLAB v0.2 — Artwork edition. The art is remotely hosted and not bundled. */
:root{--mint:#65ebd3;--purple:#ae8aff}
body{background:radial-gradient(circle at 67% -30%,#32284c 0,transparent 42%),#0b1020}
.brand-mark{background:linear-gradient(140deg,#bb9bff,#7351b8);box-shadow:0 5px 28px #8c66dd40}

.page-header h1,.open-lead h1{letter-spacing:-1.1px}
.set-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 18px}
.set-tab{min-height:56px;background:#182139;border:1px solid #354462;border-radius:12px;color:#d0dbec;text-align:left;display:flex;flex-direction:column;align-items:start;justify-content:center;padding:10px 16px;gap:3px;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.set-tab span{font-weight:900;font-size:13px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%}
.set-tab small{color:#94a8bd;font-size:9px;font-weight:800;letter-spacing:.8px}
.set-tab:hover:not(:disabled){background:#232d4a;transform:translateY(-2px)}
.set-tab.selected{border-color:#bd9df5;background:linear-gradient(110deg,#46305b66,#1b2945);box-shadow:inset 0 0 0 1px #bd9df537}
.set-tab.selected span{color:#f4e9ff}.set-tab:disabled{opacity:.45;cursor:not-allowed}.set-tab.selected:disabled{opacity:1}

.open-stage:before{background-size:32px 32px;opacity:.38}
.open-stage:after{background:#ceab7711;box-shadow:0 0 150px 45px #ecb95d17}
.open-stage .pack-holder{min-height:364px;max-height:395px}
.booster-pack.image-pack{width:184px;height:348px;border:0;border-radius:4px;overflow:hidden;position:relative;background:linear-gradient(110deg,#151c35,#5d517b,#e6a864);box-shadow:0 29px 45px #02030bd9,0 0 0 2px #f8e4c985;touch-action:none;will-change:transform}

.booster-pack.image-pack.surge{background:linear-gradient(135deg,#203b6b,#b2576c,#f2aa40)}
.booster-pack.image-pack.mew-pack{background:linear-gradient(135deg,#fffafa,#e8acc8,#a83a50)}
.booster-pack.image-pack .pack-illustration{position:absolute;inset:0;z-index:2;overflow:hidden;background:none;pointer-events:none}
.booster-pack.image-pack .pack-illustration img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:225%;max-width:none;height:auto;min-height:100%;object-fit:cover;filter:saturate(1.11) contrast(1.05)}
.booster-pack.image-pack .pack-illustration img.failed{display:none}
.booster-pack.image-pack .pack-photo-fallback{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:space-around;text-align:center;padding:18px 13px;background:radial-gradient(circle at 50% 40%,#ffd5a548,#ffffff06 42%),linear-gradient(120deg,#63478b,#16224d)}
.booster-pack.image-pack.anniversary .pack-photo-fallback{background:linear-gradient(140deg,#3a2d5e,#a37c3d,#e5b253)}
.booster-pack.image-pack.surge .pack-photo-fallback{background:linear-gradient(135deg,#253d7c,#e19d42)}
.booster-pack.image-pack.mew-pack .pack-photo-fallback{background:linear-gradient(135deg,#8b4d8f,#cb8bae)}
.booster-pack.image-pack .pack-photo-fallback .pack-eyebrow{position:static;font-size:12px;letter-spacing:1px;font-weight:950;color:white;text-shadow:0 2px 5px #0009}
.booster-pack.image-pack .pack-photo-fallback .pack-name{position:static;font-weight:950;font-size:30px;line-height:1.1;letter-spacing:-1px;color:#fff5df;text-shadow:0 4px 6px #0008}
.booster-pack.image-pack .pack-photo-fallback .pack-name.long{font-size:23px}
.booster-pack.image-pack .pack-photo-fallback .pack-emblem{position:static;font-size:62px;font-weight:950;color:#fff4bf;text-shadow:0 0 27px #fff4aa99}
.booster-pack.image-pack .pack-photo-fallback .pack-footer{position:static;letter-spacing:1px;font-size:9px;font-weight:950;color:white;text-shadow:0 2px 7px #000a}
.booster-pack.image-pack .foil-lines{z-index:3;opacity:.24;background:repeating-linear-gradient(107deg,transparent 0 21px,#ffffff4b 22px 23px,transparent 25px 40px);pointer-events:none}

.booster-pack.image-pack .tear-line{z-index:6;top:21px}
.booster-pack.image-pack .tear-guide{z-index:7;top:37px;left:50%;transform:translateX(-50%);background:#131c2ad9;border:1px solid #d2c598;font-size:10px;max-width:160px;white-space:nowrap;padding:5px 7px;border-radius:6px}

.booster-pack.image-pack:not([data-action]){cursor:default}

  <script>
/* PackLab Vision 0.6: lightweight on-device, perspective-aware card scanner.
   Results are visual estimates, never certified authentication or grades. */
window.PackLabVision = (()=>{
'use strict';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const blankCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
function drawSource(source,maxSide=680){
 const w=source.videoWidth||source.naturalWidth||source.width,h=source.videoHeight||source.naturalHeight||source.height;
 if(!(w>0&&h>0))throw Error('Photo dimensions are unavailable.');
 const scale=Math.min(1,maxSide/Math.max(w,h)),c=blankCanvas(Math.max(1,Math.round(w*scale)),Math.max(1,Math.round(h*scale)));
 c.getContext('2d',{willReadFrequently:true}).drawImage(source,0,0,c.width,c.height);return c;
}
function guideForSize(w,h){let height=Math.min(h*.83,w*.84*88/63);let width=height*63/88;return {l:(w-width)/2,r:(w+width)/2,t:(h-height)/2,b:(h+height)/2};}
function point(x,y){return {x,y};}
function bboxToQuad(b){return [point(b.l,b.t),point(b.r,b.t),point(b.r,b.b),point(b.l,b.b)];}
function gradPixel(d,w,h,x,y,direction){x=Math.round(x);y=Math.round(y);
 if(x<3||x>=w-3||y<3||y>=h-3)return 0;
 const a=direction==='v'?4*(y*w+x-2):4*((y-2)*w+x);
 const b=direction==='v'?4*(y*w+x+2):4*((y+2)*w+x);
 const r=d[a]-d[b],g=d[a+1]-d[b+1],b2=d[a+2]-d[b+2];
 return Math.abs(.299*r+.587*g+.114*b2)+.21*(Math.abs(r)+Math.abs(g)+Math.abs(b2))/3;
}
function lineProfiles(data,w,h,b,side,fast=false){
 const vertical=side==='left'||side==='right';
 const base=vertical?(side==='left'?b.l:b.r):(side==='top'?b.t:b.b);
 const other=vertical?(b.t+b.b)/2:(b.l+b.r)/2;
 const along=vertical?(b.b-b.t):(b.r-b.l);
 const range=vertical?Math.max(w*.13,(b.r-b.l)*.18):Math.max(h*.10,(b.b-b.t)*.12);
 const min=clamp(Math.floor(base-range),4,(vertical?w:h)-6);
 const max=clamp(Math.ceil(base+range),4,(vertical?w:h)-6);
 const samples=fast?16:32;
 const alongStart=other-along*.32,alongStep=along*.64/(samples-1);
 const slopes=fast?[-.16,-.08,0,.08,.16]:[-.20,-.16,-.12,-.08,-.04,0,.04,.08,.12,.16,.20];
 const scanStep=fast?4:3;
 let best=null,medianScores=[],contenders=[];
 const scoreLine=(intercept,slope)=>{
  let total=0,strong=0,peak=0;
  for(let s=0;s<samples;s++){
   const axis=alongStart+alongStep*s;
   const pos=intercept+slope*(axis-other);
   const v=vertical?gradPixel(data,w,h,pos,axis,'v'):gradPixel(data,w,h,axis,pos,'h');
   total+=v; if(v>23)strong++;peak=Math.max(peak,v);
  }
  return {mean:total/samples,coverage:strong/samples,peak};
 };
 for(let shift=min;shift<=max;shift+=scanStep){
  let atPosition=null;
  for(const slope of slopes){const q=scoreLine(shift,slope);
   const penal=(Math.abs(shift-base)/(Math.max(1,range)))*3.5+Math.abs(slope)*8;
   const score=q.mean*(.75+.25*q.coverage)-penal;
   if(!best||score>best.score)best={intercept:shift,slope,score,...q};
   if(!atPosition||score>atPosition.score)atPosition={intercept:shift,slope,score,...q};
   if(slope===0)medianScores.push(q.mean);
  }
  if(atPosition)contenders.push(atPosition);
 }
 if(!best)return null;
 // The high-contrast INNER artwork frame can outscore the actual cardboard edge.
 // If an outer, long, coherent parallel line has similar strength, prefer it.
 const outermost=side==='left'||side==='top'?-1:1;
 const supported=contenders.filter(q=>q.mean>=best.mean*.73&&q.coverage>=.64&&q.score>best.score*.72);
 if(supported.length){supported.sort((a,b)=>outermost*(b.intercept-a.intercept));
  const winner=supported[0];if(Math.abs(winner.intercept-best.intercept)<Math.max(12,(max-min)*.64))best=winner;}

 for(let intercept=best.intercept-5;intercept<=best.intercept+5;intercept++){
  for(let slope=best.slope-.05;slope<=best.slope+.05;slope+=.01){const q=scoreLine(intercept,slope),score=q.mean*(.75+.25*q.coverage)-Math.abs(intercept-base)/range*3.5-Math.abs(slope)*8;
   if(score>best.score)best={intercept,slope,score,...q};}
 }
 medianScores.sort((a,b)=>a-b);
 const median=medianScores[Math.floor(medianScores.length/2)]||1;
 best.relative=best.mean/Math.max(5,median*.65);
 best.trusted=best.mean>=19 && best.coverage>=(fast?.52:.56) && best.relative>=1.11;
 return best;
}
function cross(v,h,cy,cx){
 // x=v.intercept+v.slope*(y-cy); y=h.intercept+h.slope*(x-cx)
 const denom=1-v.slope*h.slope;
 const x=(v.intercept+v.slope*(h.intercept-cy-h.slope*cx))/denom;
 return {x,y:h.intercept+h.slope*(x-cx)};
}
function detectOuter(canvas,hint=null,fast=false){
 const w=canvas.width,h=canvas.height,ctx=canvas.getContext('2d',{willReadFrequently:true});
 if(!ctx)throw Error('Image analysis is unsupported in this browser.');
 let b=hint?{l:hint.l*w,r:hint.r*w,t:hint.t*h,b:hint.b*h}:guideForSize(w,h);
 b={l:clamp(b.l,3,w-4),r:clamp(b.r,4,w-3),t:clamp(b.t,3,h-4),b:clamp(b.b,4,h-3)};

 const candidates=[l,r,t,bot]; if(candidates.some(q=>!q))return {ok:false,confidence:'low',quad:bboxToQuad(b),reason:'Could not find four card edges.'};
 const cy=(b.t+b.b)/2,cx=(b.l+b.r)/2;
 const quad=[cross(l,t,cy,cx),cross(r,t,cy,cx),cross(r,bot,cy,cx),cross(l,bot,cy,cx)];
 const width1=Math.hypot(quad[1].x-quad[0].x,quad[1].y-quad[0].y),width2=Math.hypot(quad[2].x-quad[3].x,quad[2].y-quad[3].y);
 const height1=Math.hypot(quad[3].x-quad[0].x,quad[3].y-quad[0].y),height2=Math.hypot(quad[2].x-quad[1].x,quad[2].y-quad[1].y);
 const ratio=(width1+width2)/(height1+height2);
 const inbounds=quad.every(p=>p.x>=1&&p.x<w-1&&p.y>=1&&p.y<h-1);
 const geometry=ratio>.55&&ratio<.94&&width1>w*.28&&height1>h*.32&&Math.abs(width1-width2)/Math.max(width1,width2)<.23&&Math.abs(height1-height2)/Math.max(height1,height2)<.23;
 const strongest=Math.min(...candidates.map(p=>p.mean));
 const coverage=Math.min(...candidates.map(p=>p.coverage));
 const allTrusted=candidates.every(p=>p.trusted);
 const good=inbounds&&geometry&&allTrusted&&strongest>=21&&coverage>=.59;
 const maybe=inbounds&&geometry&&strongest>=16&&coverage>=.45;
 return {ok:good,confidence:good?(strongest>39&&coverage>.79?'high':'medium'):(maybe?'low':'none'),quad,geometry,ratio,edges:candidates.map(c=>({strength:c.mean,continuity:c.coverage})),reason:!geometry?'Card shape or aspect ratio is uncertain.':!inbounds?'Card touches the picture boundary.':!allTrusted?'Not all four outside edges are clear.':'Card outline detected.'};
}
function cornersFromFrac(points,w,h){return points.map(p=>({x:clamp(p.x/w*100,0,100),y:clamp(p.y/h*100,0,100)}));}
function cornersToPixels(points,w,h){return points.map(p=>({x:p.x/100*w,y:p.y/100*h}));}
function warpCard(canvas,points,ow=504,oh=704){
 const sw=canvas.width,sh=canvas.height,out=blankCanvas(ow,oh),inCtx=canvas.getContext('2d',{willReadFrequently:true}),src=inCtx.getImageData(0,0,sw,sh).data,ctx=out.getContext('2d',{willReadFrequently:true});

 const [p0,p1,p2,p3]=points;

function portfolioMarketQuote(entry,data){

 const tcg=data?.pricing?.tcgplayer||data?.prices?.tcgplayer;
 const rows=quoteRows(tcg);if(!rows.length)return null;

 switch(entry.finish){
  case 'Normal':match=by(k=>/normal/.test(k)&&!/reverse/.test(k));break;
  case 'Holo Foil':match=by(k=>/holofoil|holo/.test(k)&&!/reverse/.test(k));break;
  case 'Reverse Holo':match=by(k=>/reverse/.test(k));break;
  case 'Poké Ball Foil':match=by(k=>/pok[eé]?\s?ball|pokeball/.test(k)&&!/master/.test(k));break;
  case 'Master Ball Foil':match=by(k=>/master\s?ball|masterball/.test(k));break;
  default:return null;
 }
 // Different foil finishes command very different values; never substitute a mismatched market row.
 if(!match)return null;

}

const emptyResult={label:'No estimate yet',range:'—',type:'none',notes:[],confidence:'Not evaluated'};
function gradeScanEstimate(){

 if(front?.image&&ui.scanDesign==='unknown')return {...emptyResult,label:'Choose the front card design',notes:['Select a regular printed frame, thin illustration rim, or borderless design. A shiny full-art card cannot be measured like a regular bordered card.']};
 if([front,back].some(s=>s?.image&&s.hasHolder))return {...emptyResult,label:'Protective holder interferes with grading',notes:['The visible rectangle could be the plastic holder or sleeve, not the physical card. Take an unobstructed photo on a nonreflective surface for centering and condition estimates. You can still review the photo and adjust the guides manually.']};
 if(ui.scanDesign==='borderless'&&front?.image)return {...emptyResult,label:'No reliable front frame to measure',notes:['This full-art/borderless card does not have a continuous inner printed frame for the standard centering formula. Inspect the front manually and scan the back separately. A numeric photo grade would be misleading.']};
 if(!measured.length)return {...emptyResult,label:'Review and confirm both frames',notes:['Review four outside cardboard corners, tap Set outer card edges, then adjust and confirm all four inner printed guides. Unconfirmed scans are not graded.']};
 const unreadable=measured.some(s=>s.quality?.blurry||s.quality?.glareRisk);
 const clear=measured.filter(s=>!s.quality?.blurry&&!s.quality?.glareRisk);
 if(!clear.length)return {label:'Retake photo for grading',range:'—',type:'retry',confidence:'Low',notes:['The card photo may be blurred or overexposed. Retake it under diffuse, even lighting.']};
 let cap=10;
 const notes=[];
 for(const side of ['front','back']){
  const s=ui.scanScans[side];if(!s?.measured||s.outerConfidence==='none')continue;
  const c=centerRatios(s.centering),offset=Math.max(Math.abs(c.left-50),Math.abs(c.top-50));
  const limit=side==='front'?[[5,10],[8,9],[12,8],[18,7],[25,6],[35,5],[50,4]]:[[25,10],[30,9],[35,8],[39,7],[43,6],[48,5],[50,4]];
  const fit=limit.find(([max])=>offset<=max)||limit[limit.length-1];cap=Math.min(cap,fit[1]);
  notes.push(`${side==='front'?'Front':'Back'} centering: ${c.left.toFixed(1)}/${c.right.toFixed(1)} horizontal · ${c.top.toFixed(1)}/${c.bottom.toFixed(1)} vertical`);
 }
 for(const key of ['corners','edges','surface']){
  const severity=ui.visibleCondition?.[key]||'unknown';
  if(severity==='minor'){cap=Math.min(cap,9);notes.push(`Self-reported: minor ${key} imperfection.`);}
  if(severity==='moderate'){cap=Math.min(cap,7);notes.push(`Self-reported: noticeable ${key} wear.`);}
  if(severity==='severe'){cap=Math.min(cap,5);notes.push(`Self-reported: significant ${key} damage.`);}
 }
 if(back?.wear?.recognized){
  if(back.wear.corners==='possible-whitening'){cap=Math.min(cap,8);notes.push('Possible corner whitening on card back (verify close-up).');}
  if(back.wear.edges==='possible-whitening'){cap=Math.min(cap,8);notes.push('Possible edge whitening on card back (verify close-up).');}
  if(back.wear.corners==='no-obvious-whitening'&&back.wear.edges==='no-obvious-whitening')notes.push('No obvious whitening found on the blue back border; small defects can be missed.');
 } else if(back?.image)notes.push('Back wear could not be evaluated reliably against a blue border.');
 if(!front?.measured)notes.push('Scan the front to evaluate the stricter front-centering requirement.');
 if(!back?.measured)notes.push('Scan the back for centering and visible blue-border wear.');
 if(unreadable)notes.push('Possible blur or overexposure on a scan; grade range is less reliable.');
 notes.push('Scratches, dents, print lines, texture, corner rounding and gloss cannot be reliably ruled out from these photos.');
 const both=!!(front?.measured&&back?.measured);
 const verified=both&&[front,back].every(s=>s.outerConfidence==='high'||s.outerConfidence==='medium');
 const high=Math.max(1,cap),low=Math.max(1,cap-(both?2:3)-(unreadable?1:0));

function analyzeCenterPhoto(url,hint=null,side=ui.scanSide){

 if(!isMeasurableStyle()){toast('Choose a measurable card design. Borderless artwork cannot use this inner-frame method.','error');return;}

function acceptScanSuggestion(){
 const scan=activeScan();if(!scan?.rawCanvas)return;
 if(scan.hasHolder){toast('A sleeve or holder can be detected as the card. Remove it or use the manual corner adjustment.','error');ui.scanAdvanced=true;render();return;}
 if(!['high','medium','manual'].includes(scan.outerConfidence)){ui.scanAdvanced=true;render();toast('Card outline is uncertain. Adjust the corners or retake.','error');return;}
 const v=scan.centering;

 if(ui.scanSide==='front'&&ui.scanDesign==='unknown'&&plausible)ui.scanDesign='standard';
 scan.outerConfirmed=true;scan.measured=false;
 // Re-measure from the corrected rectangle, with a low-trust estimate explicitly labelled.
 computeScanWarp(scan);
 if(scan.suggested&&isMeasurableStyle()){
  scan.measured=true;scan.centerMethod='automatic-review';

function applyOuterCorrection(){const s=activeScan();if(!s?.rawCanvas){toast('Take a photo first.','error');return;}
 const pts=s.quadPct; if(!pts||pts.some(p=>!Number.isFinite(p.x+p.y))){toast('The outline needs four corners.','error');return;}
 const corners=window.PackLabVision.cornersToPixels(pts,s.rawCanvas.width,s.rawCanvas.height);
 const area=Math.abs(corners.reduce((n,p,i)=>{const q=corners[(i+1)%4];return n+p.x*q.y-q.x*p.y;},0)/2);
 const cross=pts.map((pt,i)=>{const b=pts[(i+1)%4],c=pts[(i+2)%4];return (b.x-pt.x)*(c.y-b.y)-(b.y-pt.y)*(c.x-b.x);});
 const shortSides=[0,1,2,3].map(i=>Math.hypot(corners[i].x-corners[(i+1)%4].x,corners[i].y-corners[(i+1)%4].y));
 if(area<2500||shortSides.some(v=>v<45)||cross.some(v=>v<0)!==cross.every(v=>v<0)){
  toast('Corner order is invalid or the card is too small. Place all four dots on the cardboard edge.','error');return;
 }
 s.outerConfidence='manual';s.outerConfirmed=true;s.hasHolder=ui.scanHolder;computeScanWarp(s);ui.scanEditOutline=true;displayScan(s);toast('Outer edges confirmed. Now adjust all four INNER guides and confirm their measurements.','success');
}

let centerCameraStream=null,centerCameraRequest=0,centerCameraFacing='environment',cameraDetectTimer=null;
let centerCameraMode='auto',cameraStableFrames=0,cameraLastQuad=null,cameraLockedQuad=null,cameraCaptureBusy=false;
function cameraQuadDistance(a,b){if(!a||!b)return Infinity;return Math.max(...a.map((p,i)=>Math.hypot(p.x-b[i].x,p.y-b[i].y)));}
function updateCameraModeLabel(){for(const value of ['auto','manual']){const button=document.getElementById(`cameraMode_${value}`);if(button)button.setAttribute('aria-pressed',String(value===centerCameraMode));}}

function closeCenterCamera(){centerCameraRequest++;cameraLockedQuad=null;cameraLastQuad=null;cameraStableFrames=0;cameraCaptureBusy=false;if(cameraDetectTimer){clearTimeout(cameraDetectTimer);cameraDetectTimer=null;}
 if(centerCameraStream){centerCameraStream.getTracks().forEach(t=>t.stop());centerCameraStream=null;}
 const video=document.getElementById('centerCameraVideo');if(video){video.pause();video.srcObject=null;}
 const layer=cameraLayer();if(layer){layer.hidden=true;layer.innerHTML='';}document.body.classList.remove('camera-open');}
function cameraHintNormalized(){return cameraLockedQuad?{quadPct:cameraLockedQuad.map(p=>({...p})),confidence:'high',fromLive:true}:null;}

function captureCameraStage(maxDim=980){
 const video=document.getElementById('centerCameraVideo');
 if(!video?.videoWidth||!video?.videoHeight)throw Error('Camera picture is not ready.');
 const factor=Math.min(1,maxDim/Math.max(video.videoWidth,video.videoHeight));
 const canvas=document.createElement('canvas');canvas.width=Math.round(video.videoWidth*factor);canvas.height=Math.round(video.videoHeight*factor);
 const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)throw Error('Image processing unavailable.');
 ctx.drawImage(video,0,0,canvas.width,canvas.height);return canvas;
}
function cameraImageRect(){
 const stage=document.getElementById('centerCameraStage'),video=document.getElementById('centerCameraVideo');
 if(!stage||!video?.videoWidth||!video?.videoHeight)return null;
 const box=stage.getBoundingClientRect();const scale=Math.max(box.width/video.videoWidth,box.height/video.videoHeight);
 const w=video.videoWidth*scale,h=video.videoHeight*scale;
 return {l:(box.width-w)/2/box.width,t:(box.height-h)/2/box.height,w:w/box.width,h:h/box.height};
}
function updateCameraDetectedOutline(quad,visible,locked=false){
 const overlay=document.getElementById('cameraDetectedOverlay'),poly=document.getElementById('cameraDetectedPoly');
 if(!overlay||!poly)return;
 if(visible)overlay.removeAttribute('hidden');else overlay.setAttribute('hidden','');overlay.dataset.locked=String(locked);
 if(visible){const r=cameraImageRect();if(r)poly.setAttribute('points',quad.map(p=>`${(100*r.l+p.x*r.w).toFixed(2)},${(100*r.t+p.y*r.h).toFixed(2)}`).join(' '));}
}

function scanLiveCamera(request){
 if(request!==centerCameraRequest||cameraLayer()?.hidden||!centerCameraStream||cameraCaptureBusy)return;
 try{
  const cv=window.PackLabVision,source=captureCameraStage(360);
  // Search all image locations; the cursor is never a hard-coded central rectangle.
  const scan=cv.detectOuterFlexible(source,null,true);
  const good=!!scan.ok&&['high','medium'].includes(scan.confidence);
  if(good){
   const quad=cv.cornersFromFrac(scan.quad,source.width,source.height);
   const spread=cameraQuadDistance(cameraLastQuad,quad);
   cameraStableFrames=spread<3.4?cameraStableFrames+1:1;
   cameraLastQuad=quad;
   const minx=Math.min(...quad.map(p=>p.x)),maxx=Math.max(...quad.map(p=>p.x));
   const miny=Math.min(...quad.map(p=>p.y)),maxy=Math.max(...quad.map(p=>p.y));
   const sizeOK=maxx-minx>=20&&maxy-miny>=30&&maxx-minx<94&&maxy-miny<96;
   const pictureOK=!cv.photoQuality(source).blurry;
   const locked=cameraStableFrames>=3&&sizeOK&&pictureOK&&scan.confidence==='high'&&!ui.scanHolder;
   cameraLockedQuad=locked?quad:null;
   updateCameraDetectedOutline(quad,true,locked);
   cameraStatus(ui.scanHolder?'Card-like outline found — sleeve may be mistaken for cardboard. Capture manually.':locked?'Card locked ✓':`Card detected · hold steady (${Math.min(3,cameraStableFrames)}/3)`,locked?'locked':'ready');
   if(locked&&centerCameraMode==='auto'&&!ui.scanHolder){cameraCaptureBusy=true;cameraStatus('Card locked ✓ Capturing…','locked');
    requestAnimationFrame(()=>{if(request===centerCameraRequest&&centerCameraStream)captureCenterPhoto('auto');});return;}
  }else{cameraLockedQuad=null;cameraLastQuad=null;cameraStableFrames=0;updateCameraDetectedOutline([],false);cameraStatus('Point at a single card on a plain, contrasting surface','searching');}
 }catch(e){cameraLockedQuad=null;cameraLastQuad=null;cameraStableFrames=0;updateCameraDetectedOutline([],false);cameraStatus('Keep the entire card visible, or tap Capture','searching');}
 cameraDetectTimer=setTimeout(()=>scanLiveCamera(request),330);
}

async function openCenterCamera(facing=centerCameraFacing){
 closeCenterCamera();centerCameraFacing=facing;cameraCaptureBusy=false;showCameraDialog();const request=++centerCameraRequest;const capture=document.getElementById('cameraCapture');
 if(!navigator.mediaDevices?.getUserMedia){cameraStatus('Live camera needs HTTPS or localhost. Use the photo-camera option below.','error');return;}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}}});
  if(request!==centerCameraRequest||cameraLayer()?.hidden){stream.getTracks().forEach(t=>t.stop());return;}
  centerCameraStream=stream;const video=document.getElementById('centerCameraVideo');if(!video){closeCenterCamera();return;}
  video.srcObject=stream;await video.play();if(request!==centerCameraRequest)return;
  if(video.videoWidth<1||video.videoHeight<1){cameraStatus('Waiting for a camera frame. Try again if it stays black.','error');return;}
  if(capture)capture.disabled=false;
  cameraStatus('Camera ready. You may position the card anywhere in the full frame.','searching');
  cameraDetectTimer=setTimeout(()=>scanLiveCamera(request),350);
  const track=stream.getVideoTracks()[0];if(track)track.addEventListener('ended',()=>{if(centerCameraStream===stream){if(capture)capture.disabled=true;cameraStatus('Camera stopped. Close and reopen it.','error');}});
 }catch(err){if(request!==centerCameraRequest)return;console.warn('Camera error',err);if(centerCameraStream){centerCameraStream.getTracks().forEach(t=>t.stop());centerCameraStream=null;}const failedVideo=document.getElementById('centerCameraVideo');if(failedVideo)failedVideo.srcObject=null;
  const message=err?.name==='NotAllowedError'?'Camera permission was blocked. Allow access and retry.':err?.name==='NotFoundError'?'No camera found. Use a photo instead.':err?.name==='NotReadableError'?'Camera is busy in another app.':`Could not start camera (${err?.name||'unknown error'}). Try the photo option below.`;
  cameraStatus(message,'error');if(capture)capture.disabled=true;
 }
}
function captureCenterPhoto(sourceMode='manual'){

  if(!centerCameraStream)throw Error('Camera is not ready.');

async function loadPriceForSelectedCard(force=false){
 const c=selectedPriceCard();if(!c)return;
 const id=c.id,apiId=tcgdexCardKey(c),cache=priceCache.get(id);
 if(!force&&cache&&(Date.now()-cache.time)<10*60*1000){ui.priceBusy=false;ui.priceError='';if(ui.page==='tools'&&ui.toolTab==='prices')render();return;}
 if(!apiId){ui.priceBusy=false;ui.priceError='This expansion or print has no verified card-ID mapping in the automated price feed. Use the marketplace searches to find the exact version.';if(ui.page==='tools'&&ui.toolTab==='prices')render();return;}
 ui.priceBusy=true;ui.priceError='';if(ui.page==='tools'&&ui.toolTab==='prices')render();
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),11000);
 try{
  const response=await fetch(`https://api.tcgdex.net/v2/en/cards/${encodeURIComponent(apiId)}`,{signal:controller.signal});
  if(!response.ok)throw Error(`Price feed HTTP ${response.status}`);
  const data=await response.json();
  // Guard against a plausible ID mapping to the wrong printed card.
  const clean=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const target=clean(c.name),actual=clean(data.name);
  if(data.id!==apiId||!target||!actual||!(target===actual||target.includes(actual)||actual.includes(target)))throw Error('Feed card identity does not match the selected print');
  priceCache.set(id,{time:Date.now(),data});
  if(ui.priceCardId===id)ui.priceError='';
 }catch(err){if(ui.priceCardId===id)ui.priceError='Automatic pricing is currently unavailable for this print. Compare it directly on TCGplayer and PriceCharting.';console.warn('Real card price feed unavailable',apiId,err);}finally{clearTimeout(timer);if(ui.priceCardId===id){ui.priceBusy=false;if(ui.page==='tools'&&ui.toolTab==='prices')render();}}
}
function selectPriceCard(id){

 if(!c){toast('Load this set checklist before checking prices.','error');return;}
 ui.priceSet=set;ui.priceQuery=c.name;ui.priceCardId=c.id;ui.priceError='';ui.priceBusy=false;ui.toolTab='prices';navigate('tools');void loadPriceForSelectedCard();
}

 if(!window.Tesseract){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=resolve;script.onerror=()=>reject(Error('OCR library could not load.'));document.head.appendChild(script);});}
 const output=await window.Tesseract.recognize(ui.lookupImage,'eng');resultText=String(output?.data?.text||'').trim();

function renderInfo(){return pageHeading('YOUR PLAYTEST GUIDE','How to play PackLab.','The game uses virtual cards, while Real Card Tools handles photos of your physical cards locally. Neither is a professional grading service.')+`<div class="panel panel-pad"><h3>1. Start opening packs</h3><p class="howto-copy">New collectors start with two <strong>30th Celebration</strong> boosters, two <strong>Prismatic Evolutions</strong> boosters, one <strong>151</strong> booster and one <strong>Surging Sparks</strong> booster. Open a pack at the desk, drag over the silver wrapper or tap Tear, then flip each card to inspect it. The 30th Celebration pack yields five collectible foil cards (including one Pikachu). Scarlet & Violet sets yield 10 game cards. Basic Energy and code cards are visual extras, not tradable or redeemable.</p><div class="divider"></div><h3>2. Earn more products</h3><p class="howto-copy">Claim a free daily booster, win prototype quick battles, and complete the missions. Buy additional packs using only virtual coins. Use binder rarity sorting and safe bulk sale to keep your strongest copy of each card and foil finish; virtual grading and battle copies are protected.</p><div class="divider"></div><h3>3. Grade, collect, battle</h3><p class="howto-copy">Inspect a card in your binder to see its condition and send an individual copy for a simulated 6- or 20-second grade. Open Real Card Tools → Centering for physical cards using the camera and editable guides. Permission is required; HTTPS/localhost works best, while the standalone file may vary by browser. Physical scans preserve the full photograph; move the outer card corners, then compare the straightened card against four adjustable printed-border guides. Scan both sides for a provisional grade range. Measurements and visible-wear checks are estimates and can be corrected manually. In the Battle tab, pick three owned Pokémon and challenge a quick-duel NPC. Full official-rules 60-card battling and PvP aren't implemented yet.</p><div class="divider"></div><h3>4. Data integrity & saving</h3><p class="howto-copy">Set lists come from the public Pokémon TCG dataset (including me55 and me55c for 30th Celebration), with a TCGdex fallback for Scarlet & Violet sets. Full set sizes, collector IDs and rarities are verified before pack generation. Never mixing cards between sets is an enforced rule. The first load requires internet; successful catalogs are cached locally. Card art and the official English Pokémon card-back image are streamed and may not display while offline.</p><p class="howto-copy"><strong>Art sources:</strong> Pack images are linked to external collector-shop images, and card scans are streamed from historical card-data providers. They may become unavailable or restrict hotlinking. <strong>Local only:</strong> Your coins, packs, collection, grade results and battles are saved in this browser. A different device/browser is a different save until a multiplayer account backend is added.</p><div class="open-tools" style="justify-content:flex-start"><button class="primary-action" data-action="export-save">⇩ Export your progress (.json)</button><label class="secondary-action" for="saveImport" style="cursor:pointer">⇧ Import saved progress</label><input hidden id="saveImport" type="file" accept=".json,application/json"><button class="danger-action" data-action="reset-save">Reset playtest</button></div><div class="store-note" style="margin-bottom:0">This is a noncommercial fan-made gameplay test, not an official or licensed Pokémon product. Pokémon imagery is owned by its respective rights holders. No virtual item is redeemable for physical goods, cash, grading, or real Pokémon TCG Live codes.</div></div>`;}

  if(e.id==='portfolioSet'){portfolioUI.set=e.value;portfolioUI.limit=48;render();return;}
  if(e.id==='portfolioSort'){portfolioUI.sort=e.value;render();return;}
  if(e.id==='priceSet'){ui.priceSet=SETS[e.value]?e.value:'sv8pt5';ui.priceCardId='';ui.priceQuery='';ui.priceBusy=false;ui.priceError='';requireCatalog(ui.priceSet);render();return;}
 if(e.id==='cameraHolderLive'){ui.scanHolder=!!e.checked;cameraStableFrames=0;cameraLockedQuad=null;cameraStatus(ui.scanHolder?'Holder mode: manual capture only · outline may detect the plastic':'Detecting card…','searching');return;}
 if(e.id==='scanDesign'){
  ui.scanDesign=['standard','thin','borderless','unknown'].includes(e.value)?e.value:'unknown';
  for(const sc of [ui.scanScans.front])if(sc?.rawCanvas){sc.measured=false;sc.centerMethod='';computeScanWarp(sc);}
  invalidatePhysicalMeasurement();if(ui.scanSide==='front'&&activeScan())displayScan(activeScan());else render();return;
 }
 if(e.id==='scanHolder'){
  ui.scanHolder=!!e.checked;const sc=activeScan();if(sc){sc.hasHolder=ui.scanHolder;sc.measured=false;sc.outerConfirmed=false;sc.outerConfidence='holder-unverified';ui.centerMeasured=false;ui.centerMethod='';sc.hintText=ui.scanHolder?'Plastic case or sleeve may be detected as the card edge. Manually identify cardboard corners, or remove the holder to measure.':'Confirm the actual cardboard corners, then the inner printing.';}
  render();return;
 }
  if(e.id==='bulkPackQty'){ui.bulkQty=Math.min(25,Math.max(1,Math.floor(Number(e.value)||1)));render();}
  else if(e.id==='selectedSet'){if(!state.activePack&&SETS[e.value]){state.selectedSet=e.value;save();render();}}
 else if(e.id==='binderSet'){ui.binderSet=SETS[e.value]?e.value:'sv30';ui.binderPage=1;ui.binderSearch='';render();}
 else if(e.id==='binderMode'){ui.binderMode=e.value==='all'?'all':'owned';ui.binderPage=1;render();}
 else if(e.id==='binderRarity'){ui.binderRarity=e.value;ui.binderPage=1;render();}
  else if(e.id==='binderSort'){ui.binderSort=e.value;ui.binderPage=1;render();}
  else if(e.id==='bulkSellScope'){ui.bulkSellScope=e.value==='current'?'current':'all';render();}
 else if(e.id==='saveImport'){importSave(e.files?.[0]);}
 else if(e.id==='centerPhoto'||e.id==='centerTakePhoto'){setPreviewImage('centerImage',e.files?.[0]);}
 else if(e.id==='cameraFallbackPhoto'){const file=e.files?.[0];closeCenterCamera();ui.toolTab='centering';navigate('tools');setPreviewImage('centerImage',file);}
 else if(e.id==='lookupPhoto'){setPreviewImage('lookupImage',e.files?.[0]);}
 else if(e.id==='lookupSet'){ui.lookupSet=SETS[e.value]?e.value:'sv8pt5';ui.ocrText='';requireCatalog(ui.lookupSet);render();}
 else if(e.id==='profitService'){ui.profit.service=e.value;updateProfitView();}
 else if(e.id==='ratesSet'){ui.ratesSet=e.value;ui.rateRarity='Special Illustration Rare';render();}
 else if(e.id==='rateRarity'){ui.rateRarity=e.value;updateRatesProbability();}
});
document.addEventListener('input',event=>{
 const target=event.target;
  if(target.id==='portfolioSearch'){const pos=target.selectionStart;portfolioUI.search=target.value;portfolioUI.limit=48;render();const fresh=document.getElementById('portfolioSearch');if(fresh){fresh.focus();try{fresh.setSelectionRange(pos,pos);}catch(_){}}return;}
  if(target.id==='priceSearch'){const pos=target.selectionStart;ui.priceQuery=target.value;ui.priceCardId='';ui.priceError='';ui.priceBusy=false;render();const fresh=document.getElementById('priceSearch');if(fresh){fresh.focus();try{fresh.setSelectionRange(pos,pos);}catch(_){}}return;}
 if(target.id==='ratePacks'){ui.ratePacks=target.value;updateRatesProbability();return;}
 if(target.dataset.guideScore){ui.guideScores[target.dataset.guideScore]=Number(target.value)||1;updateGuideEstimate();return;}
 if(target.dataset.profit){ui.profit[target.dataset.profit]=Number(target.value)||0;updateProfitView();return;}
 if(target.dataset.center){ui.centering[target.dataset.center]=Number(target.value)||0;ui.centerMeasured=false;ui.centerMethod='manual';ui.centerHint='Guides changed. Confirm all four printed edges when aligned.';updateCenterVisual();return;}
 if(target.id==='lookupSearch'){ui.lookupSearch=target.value;updateLookupResults();return;}
 if(target.id!=='binderSearch')return;const el=target;const pos=el.selectionStart;ui.binderSearch=el.value;ui.binderPage=1;render();const fresh=document.getElementById('binderSearch');if(fresh){fresh.focus();fresh.setSelectionRange(pos,pos);}});
document.addEventListener('submit',event=>{if(event.target?.id==='realPortfolioForm'){event.preventDefault();savePortfolioForm();}});
 document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&!cameraLayer()?.hidden){closeCenterCamera();return;}
 if(event.key==='Escape'&&!document.getElementById('modalLayer').hidden){closeModal();return;}
 if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-action="flip-card"],[data-action="tear-gesture"]')){event.preventDefault();if(event.target.dataset.action==='flip-card')revealAdvance();else claimOpenedPack();}
});
document.getElementById('modalLayer').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('visibilitychange',()=>{if(document.hidden && !cameraLayer()?.hidden)closeCenterCamera();});
window.addEventListener('pagehide',closeCenterCamera);
// Drag the four photographed OUTER corners independently; only apply after user confirms.
document.addEventListener('pointerdown',e=>{const corner=e.target.closest('[data-outer-corner]');if(!corner)return;
 ui.scanOuterDrag={index:Number(corner.dataset.outerCorner),id:e.pointerId};selectOuterCorner(ui.scanOuterDrag.index);try{corner.setPointerCapture(e.pointerId);}catch(_){ }e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!ui.scanOuterDrag)return;const editor=document.getElementById('outerCornerEditor'),scan=activeScan();if(!editor||!scan?.quadPct)return;
 const r=editor.getBoundingClientRect(),i=ui.scanOuterDrag.index;
 placeOuterCorner(i,{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100});e.preventDefault();});
document.addEventListener('pointerup',()=>{ui.scanOuterDrag=null;});
document.addEventListener('pointercancel',()=>{ui.scanOuterDrag=null;});
document.addEventListener('pointerdown',e=>{const guide=e.target.closest('[data-guide]');if(!guide)return;const canvas=document.getElementById('centeringCanvas');if(!canvas)return;ui.centerDrag={side:guide.dataset.guide};try{guide.setPointerCapture(e.pointerId);}catch(_){ }e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!ui.centerDrag)return;const canvas=document.getElementById('centeringCanvas');if(!canvas)return;const rect=canvas.getBoundingClientRect(),side=ui.centerDrag.side;const x=((e.clientX-rect.left)/rect.width)*100,y=((e.clientY-rect.top)/rect.height)*100;const value=Math.max(1,Math.min(35,(side==='left'?x:side==='right'?100-x:side==='top'?y:100-y)));ui.centering[side]=Math.round(value*10)/10;ui.centerMeasured=false;ui.centerMethod='manual';ui.centerHint='Drag the remaining guides to the printed border, then confirm all four.';updateCenterVisual();});
document.addEventListener('pointerup',()=>{ui.centerDrag=null;});
document.addEventListener('pointerdown',e=>{const pack=e.target.closest('.booster-pack[data-action="tear-gesture"]');const flip=e.target.closest('.revealer[data-action="flip-card"]');if(pack){ui.tearStart={x:e.clientX,y:e.clientY,target:pack,id:e.pointerId};try{pack.setPointerCapture(e.pointerId);}catch(_){}}else if(flip){ui.revealStart={x:e.clientX,y:e.clientY,id:e.pointerId};}});
document.addEventListener('pointermove',e=>{if(!ui.tearStart||e.pointerId!==ui.tearStart.id)return;const dx=Math.abs(e.clientX-ui.tearStart.x);const fill=document.getElementById('tearProgress');if(fill)fill.style.width=Math.min(100,dx/100*100)+'%';});
document.addEventListener('pointerup',e=>{if(ui.tearStart&&e.pointerId===ui.tearStart.id){const move=Math.abs(e.clientX-ui.tearStart.x);ui.tearStart=null;if(move>75){ignoreClickUntil=Date.now()+500;claimOpenedPack();}}if(ui.revealStart&&e.pointerId===ui.revealStart.id){const move=e.clientX-ui.revealStart.x;ui.revealStart=null;if(move<-47){ignoreClickUntil=Date.now()+500;revealAdvance();}}});
document.addEventListener('pointercancel',()=>{ui.tearStart=null;ui.revealStart=null;});
setInterval(()=>{if(state.collection.some(i=>i.status==='grading')){const done=resolveGrades();if(!done&&ui.page==='grading')render();}},1000);
render();

// Rendering the Open tab starts the selected catalog; the second only starts once requested.

</script>
