/* PACKLAB v0.2 — Artwork edition. The art is remotely hosted and not bundled. */
:root{--mint:#65ebd3;--purple:#ae8aff}
body{background:radial-gradient(circle at 67% -30%,#32284c 0,transparent 42%),#0b1020}
.brand-mark{background:linear-gradient(140deg,#bb9bff,#7351b8);box-shadow:0 5px 28px #8c66dd40}

.page-header h1,.open-lead h1{letter-spacing:-1.1px}
.set-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 18px}
.set-tab{min-height:56px;background:#182139;border:1px solid #354462;border-radius:12px;color:#d0dbec;text-align:left;display:flex;flex-direction:column;align-items:start;justify-content:center;padding:10px 16px;gap:3px;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.set-tab span{font-weight:900;font-size:13px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%}
.set-tab small{color:#94a8bd;font-size:9px;font-weight:800;letter-spacing:.8px}
.set-tab:hover:not(:disabled){background:#232d4a;transform:translateY(-2px)}
.set-tab.selected{border-color:#bd9df5;background:linear-gradient(110deg,#46305b66,#1b2945);box-shadow:inset 0 0 0 1px #bd9df537}
.set-tab.selected span{color:#f4e9ff}.set-tab:disabled{opacity:.45;cursor:not-allowed}.set-tab.selected:disabled{opacity:1}

.open-stage:before{background-size:32px 32px;opacity:.38}
.open-stage:after{background:#ceab7711;box-shadow:0 0 150px 45px #ecb95d17}
.open-stage .pack-holder{min-height:364px;max-height:395px}
.booster-pack.image-pack{width:184px;height:348px;border:0;border-radius:4px;overflow:hidden;position:relative;background:linear-gradient(110deg,#151c35,#5d517b,#e6a864);box-shadow:0 29px 45px #02030bd9,0 0 0 2px #f8e4c985;touch-action:none;will-change:transform}

.booster-pack.image-pack.surge{background:linear-gradient(135deg,#203b6b,#b2576c,#f2aa40)}
.booster-pack.image-pack.mew-pack{background:linear-gradient(135deg,#fffafa,#e8acc8,#a83a50)}
.booster-pack.image-pack .pack-illustration{position:absolute;inset:0;z-index:2;overflow:hidden;background:none;pointer-events:none}
.booster-pack.image-pack .pack-illustration img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:225%;max-width:none;height:auto;min-height:100%;object-fit:cover;filter:saturate(1.11) contrast(1.05)}
.booster-pack.image-pack .pack-illustration img.failed{display:none}
.booster-pack.image-pack .pack-photo-fallback{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:space-around;text-align:center;padding:18px 13px;background:radial-gradient(circle at 50% 40%,#ffd5a548,#ffffff06 42%),linear-gradient(120deg,#63478b,#16224d)}
.booster-pack.image-pack.anniversary .pack-photo-fallback{background:linear-gradient(140deg,#3a2d5e,#a37c3d,#e5b253)}
.booster-pack.image-pack.surge .pack-photo-fallback{background:linear-gradient(135deg,#253d7c,#e19d42)}
.booster-pack.image-pack.mew-pack .pack-photo-fallback{background:linear-gradient(135deg,#8b4d8f,#cb8bae)}
.booster-pack.image-pack .pack-photo-fallback .pack-eyebrow{position:static;font-size:12px;letter-spacing:1px;font-weight:950;color:white;text-shadow:0 2px 5px #0009}
.booster-pack.image-pack .pack-photo-fallback .pack-name{position:static;font-weight:950;font-size:30px;line-height:1.1;letter-spacing:-1px;color:#fff5df;text-shadow:0 4px 6px #0008}
.booster-pack.image-pack .pack-photo-fallback .pack-name.long{font-size:23px}
.booster-pack.image-pack .pack-photo-fallback .pack-emblem{position:static;font-size:62px;font-weight:950;color:#fff4bf;text-shadow:0 0 27px #fff4aa99}
.booster-pack.image-pack .pack-photo-fallback .pack-footer{position:static;letter-spacing:1px;font-size:9px;font-weight:950;color:white;text-shadow:0 2px 7px #000a}
.booster-pack.image-pack .foil-lines{z-index:3;opacity:.24;background:repeating-linear-gradient(107deg,transparent 0 21px,#ffffff4b 22px 23px,transparent 25px 40px);pointer-events:none}

.booster-pack.image-pack .tear-line{z-index:6;top:21px}
.booster-pack.image-pack .tear-guide{z-index:7;top:37px;left:50%;transform:translateX(-50%);background:#131c2ad9;border:1px solid #d2c598;font-size:10px;max-width:160px;white-space:nowrap;padding:5px 7px;border-radius:6px}

.booster-pack.image-pack:not([data-action]){cursor:default}

/* PackLab Vision 0.6: lightweight on-device, perspective-aware card scanner.

}
function cornersFromFrac(points,w,h){return points.map(p=>({x:clamp(p.x/w*100,0,100),y:clamp(p.y/h*100,0,100)}));}

function innerEdge(data,w,h,side){

function computeScanWarp(scan,override=false){
 const cv=window.PackLabVision;
 const src=scan.rawCanvas;
 if(!src||!scan.quadPct)throw Error('No image data available.');
 const pts=cv.cornersToPixels(scan.quadPct,src.width,src.height);
 const warped=cv.warpCard(src,pts),frame=cv.findInnerFrame(warped);

 scan.centering=frame.ok?Object.fromEntries(Object.entries(frame.guides).map(([k,v])=>[k,Math.round(v*10)/10])):{left:8,right:8,top:7,bottom:7};
 scan.measured=frame.ok&&(scan.outerConfidence!=='none');
 scan.centerMethod=frame.ok?'auto':'';
 scan.hintText=scan.measured?'Outside edges found and perspective corrected. Check INNER blue/gold guides; patterned artwork may confuse automatic detection.':scan.outerConfidence==='none'?'Outside card outline is uncertain. Adjust the four corners, apply the crop, then confirm the inner printed guides.':'No four reliable printed borders found. Drag INNER guides onto the printed frame to measure.';
 if(scan.quality.blurry)scan.hintText+=' Photo appears soft or blurry; use more light and hold steady.';
 if(scan.quality.glareRisk)scan.hintText+=' Potential overexposure: try diffuse light without glare.';
}
function startScanImage(url,hint=null){

 const rec={rawUrl:url,rawPreview:'',rawCanvas:null,image:'',hint,quadPct:null,outerConfidence:'none',measured:false,centerMethod:'',hintText:'Looking for four outside card edges…',centering:{left:8,right:8,top:7,bottom:7},quality:null,wear:null};

function analyzeCenterPhoto(url,hint=null,side=ui.scanSide){

  if(token!==centerAnalysisToken||rec!==ui.scanScans[side]||rec.rawUrl!==url)return;

   rec.outerReason=scan.reason;

   if(!scan.ok){rec.hintText='Automatic outer-edge scan was uncertain. Open “Adjust outside corners”, align them, and apply. '+rec.hintText;}
  }catch(e){console.warn('Card scan failed',e);rec.hintText='Photo could not be processed. Try another image or a supported camera format.';rec.measured=false;rec.outerConfidence='none';}

}

function captureCameraStage(maxDim=980){
 const video=document.getElementById('centerCameraVideo'),stage=document.getElementById('centerCameraStage');
 if(!video||!stage||!video.videoWidth||!video.videoHeight)throw Error('Camera picture is not ready.');
 const sr=stage.getBoundingClientRect(),sourceW=video.videoWidth,sourceH=video.videoHeight;
 // CSS object-fit: cover crops the full video into the visible preview.
 const scale=Math.max(sr.width/sourceW,sr.height/sourceH),overscanX=(sourceW*scale-sr.width)/2,overscanY=(sourceH*scale-sr.height)/2;
 const sx=Math.max(0,overscanX/scale),sy=Math.max(0,overscanY/scale),sw=Math.min(sourceW-sx,sr.width/scale),sh=Math.min(sourceH-sy,sr.height/scale);

async function runBrowserOCR(){if(!ui.lookupImage||ui.ocrBusy){if(!ui.lookupImage)toast('Add a photo first.');return;}ui.ocrBusy=true;render();let resultText='';try{
 if(!window.Tesseract){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=resolve;script.onerror=()=>reject(Error('OCR library could not load.'));document.head.appendChild(script);});}
 const output=await window.Tesseract.recognize(ui.lookupImage,'eng');resultText=String(output?.data?.text||'').trim();
 const possible=catalogMemory.get(ui.lookupSet)||[];const num=resultText.match(/\b(\d{1,3})\s*\/\s*(\d{2,3})\b/);let match;
 if(num){match=possible.find(c=>String(setNum(c.number))===String(+num[1]));}
 if(!match){const txt=resultText.toLowerCase();match=[...possible].filter(c=>c.name.length>=4&&txt.includes(c.name.toLowerCase())).sort((a,b)=>b.name.length-a.name.length)[0];}
 if(match){ui.lookupSearch=match.number;ui.ocrText=`Possible match: ${match.name} #${match.number}. Verify artwork and set.`;}
 else {ui.ocrText=resultText?'Text detected, but no confident checklist match. Enter name/number manually.':'No readable name/number found. Try a clearer photo or search manually.';}
 }catch(err){ui.ocrText='Automatic text reading unavailable. Try the manual card search below.';console.warn('OCR unavailable',err);}finally{ui.ocrBusy=false;render();}}
function guideBar(key,label){const v=ui.guideScores[key];return `<label class="field-block">${label}: <span id="guideScore_${key}">${v.toFixed(1)}</span>/10<input type="range" min="1" max="10" step="0.5" data-guide-score="${key}" value="${v}"></label>`;}
function guideEstimate(){const grades=Object.values(ui.guideScores).map(Number);return Math.min(10,Math.max(1,Math.round(Math.min(grades.reduce((a,b)=>a+b,0)/grades.length,Math.min(...grades)+.75))));}
function renderToolGuide(){return `<section class="tool-surface"><div class="tool-intro"><div><span class="eyebrow">GRADING BASICS</span><h2>What a grader checks.</h2><p>The four usual condition pillars are centering, corners, edges and surface. This tutorial can estimate a possible outcome but cannot certify or promise a grade.</p></div><span class="pill">EXPLAINER · NONOFFICIAL</span></div>
 <div class="guide-grid"><article><span class="guide-icon">⌗</span><h3>Centering</h3><p>Front and rear border alignment. Even borders look stronger than visibly off-center printing.</p></article><article><span class="guide-icon">◈</span><h3>Corners</h3><p>Look for whitening, soft corners, dents and bends, especially on darker card backs.</p></article><article><span class="guide-icon">╱</span><h3>Edges</h3><p>Check chips, fuzzy cutting, scratches, peeling and wear along every side.</p></article><article><span class="guide-icon">✧</span><h3>Surface</h3><p>Check scratches, print lines, dents, residue and creases with angled lighting.</p></article></div>
 <div class="tool-separator"></div><h3>Estimate from your inspection</h3><p class="tool-disclaimer">Adjust each condition score; weakest damage can cap a grade even if the other categories are excellent.</p><div class="tool-slider-grid">${guideBar('centering','Centering')}${guideBar('corners','Corners')}${guideBar('edges','Edges')}${guideBar('surface','Surface')}</div>
 <div class="result-card"><small>ROUGH CONDITION-BASED ESTIMATE</small><strong id="guideEstimate">~${guideEstimate()} / 10</strong><span>Virtual estimate only. Real PSA, CGC and TAG grading rules and turnaround times vary.</span></div>
 <p class="tool-disclaimer">Before paying for grading, photograph both sides, compare recent sold examples, check the current official fee schedule, and consider lower-grade outcomes.</p></section>`;}
function updateGuideEstimate(){const n=document.getElementById('guideEstimate');if(n)n.textContent=`~${guideEstimate()} / 10`;for(const key of Object.keys(ui.guideScores)){const s=document.getElementById('guideScore_'+key);if(s)s.textContent=ui.guideScores[key].toFixed(1);}}

function renderInfo(){return pageHeading('YOUR PLAYTEST GUIDE','How to play PackLab.','Everything in this prototype is simulated, free to test, and stored in your own browser.')+`<div class="panel panel-pad"><h3>1. Start opening packs</h3><p class="howto-copy">New collectors start with two <strong>30th Celebration</strong> boosters, two <strong>Prismatic Evolutions</strong> boosters, one <strong>151</strong> booster and one <strong>Surging Sparks</strong> booster. Open a pack at the desk, drag over the silver wrapper or tap Tear, then flip each card to inspect it. The 30th Celebration pack yields five collectible foil cards (including one Pikachu). Scarlet & Violet sets yield 10 game cards. Basic Energy and code cards are visual extras, not tradable or redeemable.</p><div class="divider"></div><h3>2. Earn more products</h3><p class="howto-copy">Claim a free daily booster, win prototype quick battles, and complete the missions. Buy additional packs using only virtual coins. Sell excess copies in your binder, but you must keep one copy of each card.</p><div class="divider"></div><h3>3. Grade, collect, battle</h3><p class="howto-copy">Inspect a card in your binder to see its condition and send an individual copy for a simulated 6- or 20-second grade. Open Card grading → Camera grader or Collector Tools → Centering to use your camera with alignment guides and a cropped scan. Permission is required; HTTPS/localhost works best, while the standalone file may vary by browser. Scans estimate the outside corners, straighten the photo, and detect inner borders. Scan both sides for a provisional grade range. Measurements and visible-wear checks are estimates and can be corrected manually. In the Battle tab, pick three owned Pokémon and challenge a quick-duel NPC. Full official-rules 60-card battling and PvP aren't implemented yet.</p><div class="divider"></div><h3>4. Data integrity & saving</h3><p class="howto-copy">Set lists come from the public Pokémon TCG dataset (including me55 and me55c for 30th Celebration), with a TCGdex fallback for Scarlet & Violet sets. Full set sizes, collector IDs and rarities are verified before pack generation. Never mixing cards between sets is an enforced rule. The first load requires internet; successful catalogs are cached locally. Card art and the official English Pokémon card-back image are streamed and may not display while offline.</p><p class="howto-copy"><strong>Art sources:</strong> Pack images are linked to external collector-shop images, and card scans are streamed from historical card-data providers. They may become unavailable or restrict hotlinking. <strong>Local only:</strong> Your coins, packs, collection, grade results and battles are saved in this browser. A different device/browser is a different save until a multiplayer account backend is added.</p><div class="open-tools" style="justify-content:flex-start"><button class="primary-action" data-action="export-save">⇩ Export your progress (.json)</button><label class="secondary-action" for="saveImport" style="cursor:pointer">⇧ Import saved progress</label><input hidden id="saveImport" type="file" accept=".json,application/json"><button class="danger-action" data-action="reset-save">Reset playtest</button></div><div class="store-note" style="margin-bottom:0">This is a noncommercial fan-made gameplay test, not an official or licensed Pokémon product. Pokémon imagery is owned by its respective rights holders. No virtual item is redeemable for physical goods, cash, grading, or real Pokémon TCG Live codes.</div></div>`;}
function conditionBar(label,value){return `<div class="condition-bar">${esc(label)} <strong>${Number(value).toFixed(1)}</strong><div class="progress-rail"><div style="width:${pct(value,10)}%"></div></div></div>`;}
function openInspector(cardId){const id=Object.keys(SETS).find(s=>cardId.startsWith(s+'-'));if(!id)return;ui.inspection=cardId;const catalog=requireCatalog(id),card=catalog?.find(c=>c.id===cardId),copies=allCopies(cardId);const layer=document.getElementById('modalLayer');layer.hidden=false;
 if(!card){layer.innerHTML=`<div class="modal-dialog"><button class="icon-button modal-close" data-action="close-modal" aria-label="Close">×</button>${statusCatalog(id)}</div>`;return;}
 const entries=copies.length?copies.map((i,n)=>{const status=i.status==='grading'?`<span class="pill mint">◷ Grading (${Math.max(0,Math.ceil((i.gradeDue-Date.now())/1000))}s)</span>`:i.status==='graded'?`<span class="pill gold">✦ GRADE ${i.grade}</span>`:`<span class="pill">RAW</span>`;const feeBtns=i.status==='raw'?`<button class="tertiary-action small-button" data-action="grade-standard" data-instance="${esc(i.instanceId)}">◇ Grade · 90 ◈</button><button class="secondary-action small-button" data-action="grade-express" data-instance="${esc(i.instanceId)}">⚡ Express · 130 ◈</button>`:'';const canSell=copies.length>1&&i.status!=='grading';return `<div class="copy-entry"><div class="entry-top"><strong>COPY ${n+1} <span class="muted">· ${esc(i.variant)}</span></strong>${status}</div><div class="condition-bars">${conditionBar('Centering',i.condition.centering)}${conditionBar('Corners',i.condition.corners)}${conditionBar('Edges',i.condition.edges)}${conditionBar('Surface',i.condition.surface)}</div><div class="entry-actions" style="margin-top:13px">${feeBtns}${canSell?`<button class="danger-action small-button" data-action="sell-copy" data-instance="${esc(i.instanceId)}">Sell duplicate · +${coinValue(i)} ◈</button>`:''}</div></div>`;}).join(''):`<div class="empty-note">Card not collected yet. Find it inside ${esc(SETS[id].name)} booster packs.</div>`;
 const graded=copies.find(i=>i.grade!=null);const slab=graded?`<div class="grade-slab" style="margin-top:16px"><div class="grade-slab-label"><span>PACKLAB<br><small>SIMULATED GRADE</small></span><b>${graded.grade}</b></div>${imgTag(card,true)}</div>`:'';
 layer.innerHTML=`<div class="modal-dialog" role="dialog" aria-modal="true" aria-label="Inspect ${esc(card.name)}"><button class="icon-button modal-close" data-action="close-modal" type="button" aria-label="Close details">×</button><div class="inspector-layout"><div><div class="inspector-img ${copies.some(i=>i.variant!=='Normal')?'holo':''}">${imgTag(card,true)}</div>${slab}</div><div><div class="inspector-header"><span class="pill ${chipRarity(card.rarity)}">${esc(card.rarity)}</span><h2>${esc(card.name)}</h2><p class="inspector-meta">${esc(SETS[id].name)} · #${esc(card.number)}/${SETS[id].printed} · ${esc(card.category)} ${card.hp?'· '+card.hp+' HP':''}</p><p class="small">Owned: <strong>${copies.length}</strong> · Virtual raw estimate: <strong>◈ ${COIN_VALUES[card.rarity]||5}</strong></p></div><div class="divider"></div><h3>Your individual copies</h3><p class="grade-inspect" style="margin:8px 0">A card's printed set and number never change. Grading and selling act on a specific copy, not the whole card entry.</p><div class="copy-list">${entries}</div></div></div></div>`;
}
function closeModal(){ui.inspection=null;const layer=document.getElementById('modalLayer');layer.hidden=true;layer.innerHTML='';}
function exportSave(){const text=JSON.stringify({packlabExport:true,exportedAt:new Date().toISOString(),save:state},null,2);const a=document.createElement('a');const u=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=u;a.download=`PackLab-save-${localDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Your browser save has been exported.','success');}
async function importSave(file){if(!file)return;try{const parsed=JSON.parse(await file.text());const data=parsed?.packlabExport?parsed.save:parsed;if(data?.schema!==1||!Array.isArray(data.collection)||!data.packs||!Number.isFinite(data.coins)||data.collection.length>50000)throw Error('This is not a compatible PackLab save.');for(const c of data.collection){if(!SETS[c.setId]||!String(c.cardId).startsWith(c.setId+'-')||!c.instanceId||!c.condition)throw Error('The save contains invalid card records.');}if(!confirm(`Import this save with ${data.collection.length} cards? Your current local save will be replaced.`))return;localStorage.setItem(SAVE_KEY,JSON.stringify(data));state=loadSave();state.battle=null;ui.page='open';ui.inspection=null;closeModal();save();render();toast('Save imported successfully!','success');}catch(e){toast(e.message||'Could not import save.','error');}}
function resetSave(){if(!confirm('Delete all PackLab coins, packs, grades, cards and missions from this browser? Export a backup first.'))return;if(!confirm('This cannot be undone. Reset this browser save?'))return;state=freshState();ui.page='open';closeModal();save();render();toast('A new playtest save is ready.','success');}
function navigate(page){if(!['open','store','binder','grading','battle','quests','tools','info'].includes(page))return;ui.page=page;document.activeElement?.blur?.();window.scrollTo({top:0,behavior:'instant'});render();}
function processAction(el){const action=el.dataset.action;if(!action)return;switch(action){
 case 'how-to':navigate('info');break;
 case 'tool-tab':ui.toolTab=el.dataset.tab||'rates';navigate('tools');break;
 case 'tool-rate-set':ui.ratesSet=el.dataset.set||'sv8pt5';render();break;
 case 'tool-profit-reset':ui.profit={raw:50,graded:110,fee:25,shipping:7,selling:0,service:'PSA 10'};render();break;
 case 'lookup-ocr':runBrowserOCR();break;
 case 'camera-open':openCenterCamera();break;
 case 'camera-close':closeCenterCamera();break;
 case 'camera-switch':openCenterCamera(centerCameraFacing==='environment'?'user':'environment');break;
 case 'camera-capture':captureCenterPhoto();break;
 case 'scan-side':chooseScanSide(el.dataset.side);break;
 case 'scan-new':resetPhysicalCard();break;
 case 'outer-edit':ui.scanEditOutline=!ui.scanEditOutline;render();break;
 case 'outer-apply':applyOuterCorrection();break;
 case 'center-auto':if(activeScan()?.rawUrl){const scan=activeScan();scan.measured=false;analyzeCenterPhoto(scan.rawUrl,scan.hint);}break;
 case 'centering-reset':ui.centering={left:8,right:8,top:7,bottom:7};ui.centerMeasured=false;ui.centerMethod='';ui.centerHint='Guides reset. Align all four lines to the INNER printed border.';updateCenterVisual();break;
 case 'retry-catalog':retryCatalog(el.dataset.set||state.selectedSet);break;
 case 'buy-pack':buyPacks(el.dataset.set,Number(el.dataset.count)||1);break;
 case 'store-open':state.selectedSet=el.dataset.set;save();navigate('open');break;
 case 'select-set':if(SETS[el.dataset.set]&&!state.activePack){state.selectedSet=el.dataset.set;ui.binderSet=el.dataset.set;save();render();}break;
 case 'start-pack':startPack(el.dataset.set);break;
 case 'tear-pack':claimOpenedPack();break;
 case 'tear-gesture':if(Date.now()>ignoreClickUntil)toast('Drag across the top seal, or use Tear wrapper.');break;
 case 'flip-card':if(Date.now()>ignoreClickUntil)revealAdvance();break;
 case 'finish-pack':finishPack();break;
 case 'binder-more':ui.binderPage++;render();break;
 case 'inspect':openInspector(el.dataset.card);break;
 case 'close-modal':closeModal();break;
 case 'grade-standard':submitGrade(el.dataset.instance,false);break;
 case 'grade-express':submitGrade(el.dataset.instance,true);break;
 case 'sell-copy':sellDuplicate(el.dataset.instance);break;
 case 'toggle-roster':toggleRoster(el.dataset.instance);break;
 case 'auto-roster':autoRoster();break;
 case 'start-battle':startBattle();break;
 case 'battle-attack':battleAttack(Number(el.dataset.attack)||0);break;
 case 'end-battle':state.battle=null;save();render();break;
 case 'surrender':surrenderBattle();break;
 case 'claim-quest':claimQuest(el.dataset.quest);break;
 case 'export-save':exportSave();break;
 case 'reset-save':resetSave();break;
 default:console.debug('Unknown action',action);
}}
let ignoreClickUntil=0;
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action], [data-nav]');
 if(!target||target.disabled)return;
 if(target.dataset.action){event.preventDefault();processAction(target);return;}
 if(target.dataset.nav){event.preventDefault();navigate(target.dataset.nav);}
});
document.addEventListener('change',event=>{const e=event.target;
 if(e.id==='selectedSet'){if(!state.activePack&&SETS[e.value]){state.selectedSet=e.value;save();render();}}
 else if(e.id==='binderSet'){ui.binderSet=SETS[e.value]?e.value:'sv30';ui.binderPage=1;ui.binderSearch='';render();}
 else if(e.id==='binderMode'){ui.binderMode=e.value==='all'?'all':'owned';ui.binderPage=1;render();}
 else if(e.id==='binderRarity'){ui.binderRarity=e.value;ui.binderPage=1;render();}
 else if(e.id==='saveImport'){importSave(e.files?.[0]);}
 else if(e.id==='centerPhoto'||e.id==='centerTakePhoto'){setPreviewImage('centerImage',e.files?.[0]);}
 else if(e.id==='cameraFallbackPhoto'){const file=e.files?.[0];closeCenterCamera();ui.toolTab='centering';navigate('tools');setPreviewImage('centerImage',file);}
 else if(e.id==='lookupPhoto'){setPreviewImage('lookupImage',e.files?.[0]);}
 else if(e.id==='lookupSet'){ui.lookupSet=SETS[e.value]?e.value:'sv8pt5';ui.ocrText='';requireCatalog(ui.lookupSet);render();}
 else if(e.id==='profitService'){ui.profit.service=e.value;updateProfitView();}
 else if(e.id==='ratesSet'){ui.ratesSet=e.value;ui.rateRarity='Special Illustration Rare';render();}
 else if(e.id==='rateRarity'){ui.rateRarity=e.value;updateRatesProbability();}
});
document.addEventListener('input',event=>{
 const target=event.target;
 if(target.id==='ratePacks'){ui.ratePacks=target.value;updateRatesProbability();return;}
 if(target.dataset.guideScore){ui.guideScores[target.dataset.guideScore]=Number(target.value)||1;updateGuideEstimate();return;}
 if(target.dataset.profit){ui.profit[target.dataset.profit]=Number(target.value)||0;updateProfitView();return;}
 if(target.dataset.center){ui.centering[target.dataset.center]=Number(target.value)||0;ui.centerMeasured=!!ui.centerImage;ui.centerMethod='manual';ui.centerHint='Manual guide placement. Check that each line follows the INNER printed border, not the outer card edge.';updateCenterVisual();return;}
 if(target.id==='lookupSearch'){ui.lookupSearch=target.value;updateLookupResults();return;}
 if(target.id!=='binderSearch')return;const el=target;const pos=el.selectionStart;ui.binderSearch=el.value;ui.binderPage=1;render();const fresh=document.getElementById('binderSearch');if(fresh){fresh.focus();fresh.setSelectionRange(pos,pos);}});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&!cameraLayer()?.hidden){closeCenterCamera();return;}
 if(event.key==='Escape'&&!document.getElementById('modalLayer').hidden){closeModal();return;}
 if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-action="flip-card"],[data-action="tear-gesture"]')){event.preventDefault();if(event.target.dataset.action==='flip-card')revealAdvance();else claimOpenedPack();}
});
document.getElementById('modalLayer').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('visibilitychange',()=>{if(document.hidden && !cameraLayer()?.hidden)closeCenterCamera();});
window.addEventListener('pagehide',closeCenterCamera);
// Drag the four photographed OUTER corners independently; only apply after user confirms.
document.addEventListener('pointerdown',e=>{const corner=e.target.closest('[data-outer-corner]');if(!corner)return;
 ui.scanOuterDrag={index:Number(corner.dataset.outerCorner),id:e.pointerId};try{corner.setPointerCapture(e.pointerId);}catch(_){ }e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!ui.scanOuterDrag)return;const editor=document.getElementById('outerCornerEditor'),scan=activeScan();if(!editor||!scan?.quadPct)return;
 const r=editor.getBoundingClientRect(),i=ui.scanOuterDrag.index;
 scan.quadPct[i]={x:Math.min(98,Math.max(2,(e.clientX-r.left)/r.width*100)),y:Math.min(98,Math.max(2,(e.clientY-r.top)/r.height*100))};
 const handle=editor.querySelector(`[data-outer-corner="${i}"]`);if(handle){handle.style.left=scan.quadPct[i].x+'%';handle.style.top=scan.quadPct[i].y+'%';}
 const polygon=document.getElementById('outerPolygon');if(polygon)polygon.setAttribute('points',scan.quadPct.map(p=>`${p.x},${p.y}`).join(' '));e.preventDefault();});
document.addEventListener('pointerup',()=>{ui.scanOuterDrag=null;});
document.addEventListener('pointercancel',()=>{ui.scanOuterDrag=null;});
document.addEventListener('pointerdown',e=>{const guide=e.target.closest('[data-guide]');if(!guide)return;const canvas=document.getElementById('centeringCanvas');if(!canvas)return;ui.centerDrag={side:guide.dataset.guide};e.preventDefault();});
document.addEventListener('pointermove',e=>{if(!ui.centerDrag)return;const canvas=document.getElementById('centeringCanvas');if(!canvas)return;const rect=canvas.getBoundingClientRect(),side=ui.centerDrag.side;const x=((e.clientX-rect.left)/rect.width)*100,y=((e.clientY-rect.top)/rect.height)*100;const value=Math.max(1,Math.min(35,(side==='left'?x:side==='right'?100-x:side==='top'?y:100-y)));ui.centering[side]=Math.round(value*10)/10;ui.centerMeasured=!!ui.centerImage;ui.centerMethod='manual';ui.centerHint='Manual measurement. Adjust the other guides too before trusting the ratio.';updateCenterVisual();});
document.addEventListener('pointerup',()=>{ui.centerDrag=null;});
document.addEventListener('pointerdown',e=>{const pack=e.target.closest('.booster-pack[data-action="tear-gesture"]');const flip=e.target.closest('.revealer[data-action="flip-card"]');if(pack){ui.tearStart={x:e.clientX,y:e.clientY,target:pack,id:e.pointerId};try{pack.setPointerCapture(e.pointerId);}catch(_){}}else if(flip){ui.revealStart={x:e.clientX,y:e.clientY,id:e.pointerId};}});
document.addEventListener('pointermove',e=>{if(!ui.tearStart||e.pointerId!==ui.tearStart.id)return;const dx=Math.abs(e.clientX-ui.tearStart.x);const fill=document.getElementById('tearProgress');if(fill)fill.style.width=Math.min(100,dx/100*100)+'%';});
document.addEventListener('pointerup',e=>{if(ui.tearStart&&e.pointerId===ui.tearStart.id){const move=Math.abs(e.clientX-ui.tearStart.x);ui.tearStart=null;if(move>75){ignoreClickUntil=Date.now()+500;claimOpenedPack();}}if(ui.revealStart&&e.pointerId===ui.revealStart.id){const move=e.clientX-ui.revealStart.x;ui.revealStart=null;if(move<-47){ignoreClickUntil=Date.now()+500;revealAdvance();}}});
document.addEventListener('pointercancel',()=>{ui.tearStart=null;ui.revealStart=null;});
setInterval(()=>{if(state.collection.some(i=>i.status==='grading')){const done=resolveGrades();if(!done&&ui.page==='grading')render();}},1000);
render();
